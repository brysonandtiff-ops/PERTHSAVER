<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - Perth Saver</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f1f 0%, #1a1a2e 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      opacity: 0.8;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      background: linear-gradient(135deg, #2dd4bf 0%, #06b6d4 100%);
      color: #0f0f1f;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, opacity 0.2s;
      border: none;
      cursor: pointer;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .tips {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    .tips h3 {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .tips ul {
      list-style: none;
    }

    .tips li {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 8px;
      padding-left: 20px;
      position: relative;
    }

    .tips li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #2dd4bf;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" stroke="#2dd4bf" stroke-width="2" opacity="0.3"/>
      <path d="M50 30 L50 70 M30 50 L70 50" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
      <g opacity="0.5">
        <line x1="35" y1="35" x2="65" y2="65" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
        <line x1="65" y1="35" x2="35" y2="65" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      </g>
    </svg>

    <h1>You're Offline</h1>
    <p>Perth Saver is ready to work offline! Some features may be limited until you reconnect.</p>

    <button class="button" onclick="window.location.href='/';">Try Again</button>

    <div class="tips">
      <h3>What you can still do:</h3>
      <ul>
        <li>View your saved deals & alerts</li>
        <li>Check your dashboard statistics</li>
        <li>Read community posts</li>
        <li>Browse your wishlist</li>
      </ul>
    </div>
  </div>

  <script>
    // Check connection status
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
