<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-gradient-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="logo-gradient-emerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="logo-gradient-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8" />
      <stop offset="50%" stop-color="#C0C0C0" />
      <stop offset="100%" stop-color="#A8A8A8" />
    </linearGradient>
    <linearGradient id="coin-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="50" cy="50" r="46" fill="url(#logo-gradient-cyan)" filter="url(#logo-glow)" />
  
  <!-- Dark inner circle -->
  <circle cx="50" cy="50" r="42" fill="#0A0A0A" />
  
  <!-- Subtle emerald overlay -->
  <circle cx="50" cy="50" r="38" fill="url(#logo-gradient-emerald)" opacity="0.15" />

  <!-- Piggy bank body -->
  <g>
    <!-- Body base -->
    <ellipse cx="50" cy="62" rx="22" ry="18" fill="url(#logo-gradient-cyan)" />
    <ellipse cx="50" cy="60" rx="20" ry="16" fill="#0A0A0A" />
    <ellipse cx="50" cy="59" rx="18" ry="14" fill="url(#logo-gradient-emerald)" opacity="0.3" />
    
    <!-- Piggy snout/head -->
    <path
      d="M35 55 Q35 40 50 35 Q65 40 65 55"
      stroke="url(#logo-gradient-cyan)"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />
    
    <!-- Ears -->
    <circle cx="38" cy="42" r="5" fill="url(#logo-gradient-cyan)" />
    <circle cx="62" cy="42" r="5" fill="url(#logo-gradient-cyan)" />
  </g>

  <!-- Coin -->
  <g>
    <circle cx="74" cy="28" r="12" fill="url(#logo-gradient-silver)" />
    <circle cx="74" cy="28" r="10" fill="url(#logo-gradient-emerald)" />
    <text
      x="74"
      y="32"
      text-anchor="middle"
      fill="white"
      font-size="12"
      font-weight="bold"
      font-family="system-ui, -apple-system, sans-serif"
    >$</text>
    <circle cx="74" cy="28" r="12" fill="url(#coin-shine)" />
  </g>

  <!-- Decorative savings wave -->
  <path
    d="M15 75 Q25 65 35 70 Q45 75 50 68"
    stroke="url(#logo-gradient-cyan)"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
    opacity="0.6"
  />
  <path
    d="M50 68 Q55 62 65 67 Q75 72 85 65"
    stroke="url(#logo-gradient-emerald)"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
    opacity="0.6"
  />

  <!-- Outer ring highlight -->
  <circle cx="50" cy="50" r="46" stroke="url(#logo-gradient-silver)" stroke-width="1.5" fill="none" opacity="0.3" />
</svg>
